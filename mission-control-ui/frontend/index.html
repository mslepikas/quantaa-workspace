<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mission Control Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); color: #e8e8e8; min-height: 100vh; padding: 20px; }
    .container { max-width: 1000px; margin: 0 auto; }
    h1 { text-align: center; margin-bottom: 20px; font-size: 1.8em; color: #f08c00; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
    .card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 16px; transition: transform 0.2s; }
    .card:hover { transform: translateY(-2px); background: rgba(255,255,255,0.08); }
    .card h3 { font-size: 1.1em; margin-bottom: 12px; color: #f08c00; }
    .card p { font-size: 0.9em; color: #ccc; line-height: 1.6; }
    .status { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 0.8em; font-weight: 500; }
    .status.active { background: #2ecc71; color: #000; }
    .status.idle { background: #f39c12; color: #000; }
    .status.offline { background: #e74c3c; color: #fff; }
    .system-card { grid-column: 1 / -1; background: rgba(255,255,255,0.08); }
    .system-card h3 { color: #f08c00; }
    .system-stats { display: flex; gap: 24px; flex-wrap: wrap; }
    .stat { min-width: 140px; }
    .stat label { font-size: 0.85em; color: #888; }
    .stat span { font-size: 1.2em; font-weight: 600; color: #f08c00; }
    .actions { grid-column: 1 / -1; margin-top: 16px; }
    .btn { display: inline-block; padding: 10px 20px; background: linear-gradient(135deg, #f39c12, #f08c00); color: #000; border: none; border-radius: 8px; cursor: pointer; font-size: 0.95em; font-weight: 600; margin: 8px; transition: all 0.2s; }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(243,156,18,0.4); }
    .loading { text-align: center; padding: 40px; color: #888; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🦞 Mission Control Dashboard</h1>
    <div id="loading" class="loading">Loading data...</div>
    <div id="content" style="display:none;">
      <div class="grid">
        <div class="card system-card">
          <h3>🖥️ System Health</h3>
          <div class="system-stats">
            <div class="stat"><label>Uptime</label><span id="uptime">—</span></div>
            <div class="stat"><label>Memory</label><span id="memory">—</span></div>
            <div class="stat"><label>Load Avg</label><span id="load">—</span></div>
            <div class="stat"><label>Models</label><span id="models">—</span></div>
          </div>
        </div>
        <div id="agents-grid"></div>
        <div class="card actions">
          <h3>⚡ Quick Actions</h3>
          <button class="btn" onclick="refreshData()">🔄 Refresh</button>
          <button class="btn" style="background: linear-gradient(135deg, #3498db, #2980b9);">🚀 Spawn New Agent</button>
          <button class="btn" style="background: linear-gradient(135deg, #e74c3c, #c0392b);">🔧 Restart Gateway</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const agentsGrid = document.getElementById('agents-grid');
    const content = document.getElementById('content');
    const loading = document.getElementById('loading');

    async function fetchAgents() {
      const res = await fetch('/api/agents');
      const data = await res.json();
      agentsGrid.innerHTML = data.map(agent => `
        <div class="card">
          <h3>${agent.id} — ${agent.name}</h3>
          <p>${agent.tasks}</p>
          <span class="status ${agent.status}">${agent.status}</span>
        </div>
      `).join('');
    }

    async function fetchSystem() {
      const res = await fetch('/api/system');
      const data = await res.json();
      document.getElementById('uptime').textContent = data.uptimeDays + ' days';
      document.getElementById('memory').textContent = data.memory.percent;
      document.getElementById('load').textContent = data.load;
      document.getElementById('models').textContent = data.models;
    }

    async function fetchGateway() {
      const res = await fetch('/api/gateway');
      // Could expand if needed
    }

    async function refreshData() {
      loading.style.display = 'block';
      content.style.display = 'none';
      await Promise.all([fetchAgents(), fetchSystem(), fetchGateway()]);
      loading.style.display = 'none';
      content.style.display = 'block';
    }

    // Initial load
    refreshData();

    // Auto-refresh every 30 seconds
    setInterval(refreshData, 30000);
  </script>
</body>
</html>
