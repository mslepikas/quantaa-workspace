<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🦞 Mission Control Dashboard</title>
  <style>
    :root {
      --primary-bg: #0a0a0a;
      --secondary-bg: #121212;
      --card-bg: rgba(30, 30, 30, 0.7);
      --accent-orange: #f08c00;
      --accent-orange-dark: #d47600;
      --text-primary: #f0f0f0;
      --text-secondary: #aaa;
      --border-color: rgba(255, 255, 255, 0.1);
      --success: #2ecc71;
      --warning: #f39c12;
      --danger: #e74c3c;
      --hover-bg: rgba(255, 255, 255, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--primary-bg);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 20px;
      overflow-x: hidden;
    }

    .container {
      max-width: 100%;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 2.5em;
      color: var(--accent-orange);
      text-shadow: 0 0 10px rgba(240, 140, 0, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
    }

    h1 span {
      font-size: 1.8em;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 15px;
      padding: 20px;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
      border-color: rgba(240, 140, 0, 0.3);
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-color);
    }

    .card-header h2 {
      font-size: 1.4em;
      color: var(--accent-orange);
    }

    .card-content {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .status-badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85em;
      font-weight: 600;
      margin-top: 5px;
    }

    .status-active {
      background: var(--success);
      color: #000;
    }

    .status-idle {
      background: var(--warning);
      color: #000;
    }

    .status-offline {
      background: var(--danger);
      color: #fff;
    }

    .system-card {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .system-stat {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .stat-label {
      font-size: 0.9em;
      color: var(--text-secondary);
    }

    .stat-value {
      font-size: 1.4em;
      font-weight: 700;
      color: var(--accent-orange);
    }

    .agent-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 15px;
    }

    .agent-card {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .agent-header {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .agent-emoji {
      font-size: 1.8em;
    }

    .agent-name {
      font-size: 1.2em;
      font-weight: 600;
    }

    .agent-details {
      font-size: 0.9em;
      color: var(--text-secondary);
      margin-top: 5px;
    }

    .tasks-card {
      grid-column: 1 / -1;
    }

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .task-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 10px;
      border-left: 4px solid var(--accent-orange);
    }

    .task-info {
      flex: 1;
    }

    .task-agent {
      font-weight: 600;
      color: var(--accent-orange);
    }

    .task-description {
      font-size: 0.95em;
      margin-top: 4px;
    }

    .task-time {
      font-size: 0.85em;
      color: var(--text-secondary);
    }

    .model-card {
      grid-column: 1 / -1;
    }

    .model-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }

    .model-item {
      padding: 15px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 10px;
      text-align: center;
    }

    .model-name {
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--accent-orange);
    }

    .model-details {
      font-size: 0.9em;
      color: var(--text-secondary);
    }

    .metrics-card {
      grid-column: 1 / -1;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }

    .metric-item {
      padding: 15px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 10px;
    }

    .metric-label {
      font-size: 0.9em;
      color: var(--text-secondary);
      margin-bottom: 5px;
    }

    .metric-value {
      font-size: 1.2em;
      font-weight: 600;
    }

    .actions {
      grid-column: 1 / -1;
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .btn {
      padding: 12px 24px;
      background: linear-gradient(135deg, var(--accent-orange), var(--accent-orange-dark));
      color: #000;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1em;
      font-weight: 600;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(240, 140, 0, 0.4);
    }

    .btn-refresh {
      background: linear-gradient(135deg, #3498db, #2980b9);
      color: #fff;
    }

    .btn-spawn {
      background: linear-gradient(135deg, #9b59b6, #8e44ad);
      color: #fff;
    }

    .btn-restart {
      background: linear-gradient(135deg, #e74c3c, #c0392b);
      color: #fff;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: var(--text-secondary);
      font-size: 1.2em;
    }

    .refresh-indicator {
      position: fixed;
      top: 20px;
      right: 20px;
      background: var(--card-bg);
      padding: 10px 15px;
      border-radius: 8px;
      font-size: 0.9em;
      border: 1px solid var(--border-color);
      display: none;
    }

    .pulse {
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.6; }
      50% { opacity: 1; }
      100% { opacity: 0.6; }
    }

    @media (max-width: 768px) {
      .dashboard-grid {
        grid-template-columns: 1fr;
      }
      
      .system-card {
        grid-template-columns: 1fr;
      }
      
      .actions {
        flex-direction: column;
        align-items: center;
      }
      
      .btn {
        width: 100%;
        max-width: 300px;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1><span>🦞</span> Mission Control Dashboard</h1>
    <div id="loading" class="loading">Loading system data...</div>
    <div id="content" style="display:none;">
      <div class="dashboard-grid">
        <!-- System Health Card -->
        <div class="card system-card">
          <div class="card-header">
            <h2>🖥️ System Health</h2>
          </div>
          <div class="card-content">
            <div class="system-stat">
              <span class="stat-label">Uptime</span>
              <span class="stat-value" id="uptime">—</span>
            </div>
            <div class="system-stat">
              <span class="stat-label">Memory Usage</span>
              <span class="stat-value" id="memory">—</span>
            </div>
            <div class="system-stat">
              <span class="stat-label">Load Average</span>
              <span class="stat-value" id="load">—</span>
            </div>
            <div class="system-stat">
              <span class="stat-label">Active Models</span>
              <span class="stat-value" id="models">—</span>
            </div>
          </div>
        </div>

        <!-- Agents Grid -->
        <div id="agents-grid" class="agent-grid"></div>

        <!-- Active Tasks -->
        <div class="card tasks-card">
          <div class="card-header">
            <h2>📋 Active Tasks</h2>
          </div>
          <div class="card-content">
            <div class="task-list" id="tasks-list">
              <!-- Tasks will be populated here -->
            </div>
          </div>
        </div>

        <!-- Model Configuration -->
        <div class="card model-card">
          <div class="card-header">
            <h2>🧠 Model Configuration</h2>
          </div>
          <div class="card-content">
            <div class="model-grid" id="models-grid">
              <!-- Models will be populated here -->
            </div>
          </div>
        </div>

        <!-- Quick Metrics -->
        <div class="card metrics-card">
          <div class="card-header">
            <h2>📊 Quick Metrics</h2>
          </div>
          <div class="card-content">
            <div class="metrics-grid" id="metrics-grid">
              <!-- Metrics will be populated here -->
            </div>
          </div>
        </div>

        <!-- Quick Actions -->
        <div class="card actions">
          <div class="card-header">
            <h2>⚡ Quick Actions</h2>
          </div>
          <div class="card-content">
            <div class="actions">
              <button class="btn btn-refresh" onclick="refreshData()">
                🔄 Refresh All Data
              </button>
              <button class="btn btn-spawn" onclick="spawnAgent()">
                🚀 Spawn New Agent
              </button>
              <button class="btn btn-restart" onclick="restartGateway()">
                🔧 Restart Gateway
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="refresh-indicator" id="refresh-indicator">
    Refreshing data...
  </div>

  <script>
    const content = document.getElementById('content');
    const loading = document.getElementById('loading');
    const agentsGrid = document.getElementById('agents-grid');
    const tasksList = document.getElementById('tasks-list');
    const modelsGrid = document.getElementById('models-grid');
    const metricsGrid = document.getElementById('metrics-grid');
    const refreshIndicator = document.getElementById('refresh-indicator');

    // Agent definitions
    const agentDefs = [
      { id: 'Q', name: 'Developers', emoji: '🐾', group: 'business' },
      { id: 'Danno', name: 'Security', emoji: '🛡️', group: 'business' },
      { id: 'Scout', name: 'Researcher', emoji: '🔍', group: 'business' },
      { id: 'Fin', name: 'Banking', emoji: '💰', group: 'business' },
      { id: 'Ash', name: 'Social/Travel', emoji: '✈️', group: 'personal' },
      { id: 'Flo', name: 'Housekeeping', emoji: '🧹', group: 'personal' },
      { id: 'Jerrica', name: 'Personal Assistant', emoji: '🖊️', group: 'personal' },
      { id: 'Atlas', name: 'Health & Fitness', emoji: '💪', group: 'personal' }
    ];

    // Show refresh indicator
    function showRefreshIndicator() {
      refreshIndicator.style.display = 'block';
      setTimeout(() => {
        refreshIndicator.style.display = 'none';
      }, 2000);
    }

    // Format timestamp
    function formatTimeAgo(timestamp) {
      if (!timestamp) return 'Never';
      const now = new Date();
      const time = new Date(timestamp);
      const diff = now - time;
      const minutes = Math.floor(diff / 60000);
      const hours = Math.floor(diff / 3600000);
      const days = Math.floor(diff / 86400000);
      
      if (days > 0) return `${days}d ago`;
      if (hours > 0) return `${hours}h ago`;
      if (minutes > 0) return `${minutes}m ago`;
      return 'Just now';
    }

    // Fetch agents data
    async function fetchAgents() {
      try {
        const res = await fetch('/api/agents');
        const data = await res.json();
        
        agentsGrid.innerHTML = data.map(agent => {
          const agentDef = agentDefs.find(a => a.id === agent.id);
          const statusClass = agent.status === 'active' ? 'status-active' : 
                            agent.status === 'idle' ? 'status-idle' : 'status-offline';
          
          return `
            <div class="card agent-card">
              <div class="agent-header">
                <span class="agent-emoji">${agentDef?.emoji || '❓'}</span>
                <div>
                  <div class="agent-name">${agentDef?.name || agent.id}</div>
                  <div class="agent-details">
                    <span class="status-badge ${statusClass}">${agent.status}</span>
                    <span style="margin-left: 10px;">${agent.sessionCount} sessions</span>
                  </div>
                </div>
              </div>
              <div class="card-content">
                <div class="agent-details">
                  <strong>Current Model:</strong> ${agent.currentModel || 'n/a'}
                </div>
                <div class="agent-details">
                  <strong>Last Activity:</strong> ${formatTimeAgo(agent.lastActivity)}
                </div>
              </div>
            </div>
          `;
        }).join('');
      } catch (error) {
        console.error('Error fetching agents:', error);
        agentsGrid.innerHTML = '<div class="loading">Failed to load agents data</div>';
      }
    }

    // Fetch system data
    async function fetchSystem() {
      try {
        const res = await fetch('/api/system');
        const data = await res.json();
        
        document.getElementById('uptime').textContent = data.uptimeDays + ' days';
        document.getElementById('memory').textContent = data.memory.percent;
        document.getElementById('load').textContent = data.load;
        document.getElementById('models').textContent = data.models;
      } catch (error) {
        console.error('Error fetching system data:', error);
        document.getElementById('uptime').textContent = 'Error';
        document.getElementById('memory').textContent = 'Error';
        document.getElementById('load').textContent = 'Error';
        document.getElementById('models').textContent = 'Error';
      }
    }

    // Fetch tasks data
    async function fetchTasks() {
      try {
        const res = await fetch('/api/tasks');
        const data = await res.json();
        
        if (data.active && data.active.length > 0) {
          tasksList.innerHTML = data.active.map(task => {
            const agentDef = agentDefs.find(a => a.id === task.agent);
            return `
              <div class="task-item">
                <div class="task-info">
                  <div class="task-agent">${agentDef?.name || task.agent}</div>
                  <div class="task-description">${task.task}</div>
                </div>
                <div class="task-time">${formatTimeAgo(task.time)}</div>
              </div>
            `;
          }).join('');
        } else {
          tasksList.innerHTML = '<div class="loading">No active tasks</div>';
        }
      } catch (error) {
        console.error('Error fetching tasks:', error);
        tasksList.innerHTML = '<div class="loading">Failed to load tasks data</div>';
      }
    }

    // Fetch models data
    async function fetchModels() {
      try {
        const res = await fetch('/api/models');
        const data = await res.json();
        
        modelsGrid.innerHTML = `
          <div class="model-item">
            <div class="model-name">Primary</div>
            <div class="model-details">${data.primary}</div>
          </div>
          <div class="model-item">
            <div class="model-name">Fallbacks</div>
            <div class="model-details">${data.fallbacks.join(', ')}</div>
          </div>
          <div class="model-item">
            <div class="model-name">Provider</div>
            <div class="model-details">${data.provider}</div>
          </div>
          <div class="model-item">
            <div class="model-name">Gateway</div>
            <div class="model-details">${data.gatewayVersion} (${data.gatewayUptime})</div>
          </div>
        `;
      } catch (error) {
        console.error('Error fetching models:', error);
        modelsGrid.innerHTML = '<div class="loading">Failed to load models data</div>';
      }
    }

    // Fetch metrics data
    async function fetchMetrics() {
      try {
        const res = await fetch('/api/metrics');
        const data = await res.json();
        
        metricsGrid.innerHTML = `
          <div class="metric-item">
            <div class="metric-label">Agents</div>
            <div class="metric-value">${data.totalAgents}</div>
          </div>
          <div class="metric-item">
            <div class="metric-label">Sessions</div>
            <div class="metric-value">${data.totalSessions}</div>
          </div>
          <div class="metric-item">
            <div class="metric-label">Security</div>
            <div class="metric-value">${data.security.critical} critical, ${data.security.warn} warn</div>
          </div>
          <div class="metric-item">
            <div class="metric-label">Platform</div>
            <div class="metric-value">${data.platform.split(' ')[0]}</div>
          </div>
        `;
      } catch (error) {
        console.error('Error fetching metrics:', error);
        metricsGrid.innerHTML = '<div class="loading">Failed to load metrics data</div>';
      }
    }

    // Refresh all data
    async function refreshData() {
      showRefreshIndicator();
      
      try {
        await Promise.all([
          fetchAgents(),
          fetchSystem(),
          fetchTasks(),
          fetchModels(),
          fetchMetrics()
        ]);
        
        loading.style.display = 'none';
        content.style.display = 'block';
      } catch (error) {
        console.error('Error refreshing data:', error);
        loading.innerHTML = '<div class="loading">Error loading data. Please try again.</div>';
      }
    }

    // Spawn new agent (placeholder)
    function spawnAgent() {
      alert('Spawn new agent functionality would be implemented here');
    }

    // Restart gateway (placeholder)
    function restartGateway() {
      alert('Restart gateway functionality would be implemented here');
    }

    // Initial load
    refreshData();

    // Auto-refresh every 15 seconds
    setInterval(refreshData, 15000);
  </script>
</body>
</html>
